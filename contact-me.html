<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
</head>

<body>
    <h1>My Contact Details</h1>
    <p>My Fictional Address</p>
    <p>0772345678</p>
    <p>myemail@gmail.com</p>
    <hr>
    
    <form action="mailto:myemail@gmail.com" method="post" enctype="text/plain">
        <label for="name">Your Name:</label>
        <input type="text" name="YourName" id="name"><br>

        <label for="email">Your Email:</label>
        <input type="email" name="YourEmail" id="email"><br>

        <label for="message">Your Message:</label><br>
        <textarea name="YourMessage" id="message" rows="10" cols="30"></textarea><br>
        
        <input type="submit" value="Submit">
    </form>
</body>

</html>
